name: Build WN-Turnip Drivers

on:
  schedule:
    # Weekly on Wednesday 12:00 UTC (first run 2026-07-08).
    - cron: '0 12 * * 3'
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or branch to build & release"
        required: false
        default: main
      publish:
        description: "Publish the release. Leave false to create it as a GitHub DRAFT — assets and notes attached, no tag created until you publish it."
        required: false
        type: boolean
        default: false

# schedule + workflow_dispatch release (tag + GitHub release, version bumped);
# PR and push only build a preview. Release events serialize on build-release.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('build-pr-{0}', github.event.pull_request.number) || (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && 'build-release' || format('build-push-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      build_version: ${{ steps.ver.outputs.build_version }}
      tag_name: ${{ steps.ver.outputs.tag_name }}
      release: ${{ steps.ver.outputs.release }}
      publish: ${{ steps.ver.outputs.publish }}
      head_sha: ${{ steps.ver.outputs.head_sha }}
      mesa_commit: ${{ steps.mesa.outputs.commit }}
      mesa_version: ${{ steps.mesa.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || inputs.ref || github.sha }}
          persist-credentials: false

      - name: Resolve build version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags --quiet
          head_sha=$(git rev-parse HEAD)
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"

          # Next version = latest PUBLISHED v1.NN release + 1 (zero-padded, floor 1.03).
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                     --jq '.[] | select(.draft==false and .prerelease==false) | .tag_name' 2>/dev/null \
                   | grep -E '^v1\.[0-9]{2}$' | sort -V | tail -n1 | sed 's/^v//' || true)
          if [ -z "${latest:-}" ]; then
            next_base="1.03"
          else
            n=$((10#${latest#1.}))
            next_base=$(printf '1.%02d' "$((n + 1))")
          fi

          case "${{ github.event_name }}" in
            pull_request)
              build_ver="${next_base}-PR${{ github.event.pull_request.number }}"
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            push)
              build_ver="${next_base}"
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            schedule|workflow_dispatch)
              # Both paths create the GitHub release. publish=false makes it a
              # DRAFT: assets and notes are attached and it sits unpublished, so
              # no git tag exists until someone hits Publish. The weekly schedule
              # always publishes outright.
              publish="${{ github.event.inputs.publish }}"
              if [ "${{ github.event_name }}" = "schedule" ]; then
                publish="true"
              fi
              build_ver="${next_base}"
              echo "release=true" >> "$GITHUB_OUTPUT"
              echo "tag_name=v${next_base}" >> "$GITHUB_OUTPUT"
              if [ "${publish}" = "true" ]; then
                # Only a publish is irreversible, so only a publish is guarded.
                # A draft can be regenerated as often as you like.
                if git rev-parse "v${next_base}" >/dev/null 2>&1; then
                  echo "::error::Tag v${next_base} already exists; refusing to release the same version twice."
                  exit 1
                fi
                echo "publish=true" >> "$GITHUB_OUTPUT"
              else
                echo "publish=false" >> "$GITHUB_OUTPUT"
                echo "Draft release: assets and notes attached, no tag until published."
              fi
              ;;
          esac
          echo "build_version=${build_ver}" >> "$GITHUB_OUTPUT"
          echo "Resolved build version: ${build_ver} (event=${{ github.event_name }})"

      - name: Install host build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build patchelf unzip curl python3-pip flex bison zip \
            glslang-tools ccache
          # Mesa main requires meson >= 1.4; Ubuntu 24.04 apt only ships 1.3.2.
          sudo python3 -m pip install --quiet --break-system-packages "meson>=1.4" mako
          meson --version

      - name: Set up Android NDK r26d
        id: ndk
        # nttld/setup-ndk v1.5.0
        uses: nttld/setup-ndk@afb4c9964b521afb97c864b7d40b11e6911bd410
        with:
          ndk-version: r26d
          add-to-path: false
          local-cache: true

      - name: Build -b and -p variants
        env:
          BUILD_VERSION: ${{ steps.ver.outputs.build_version }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: ./build_wn_turnip.sh

      # A patch script that finds no anchor logs and moves on, so the zip still
      # builds and installs while silently missing the fix. Only the build log
      # can catch that, and the RedMagic display fixes ride EXTRA_SCRIPT onto
      # both variants, so both logs are checked.
      - name: Verify patches landed on both variants
        run: ./verify_patches.sh b p

      # Which mesa a release was built from is the first thing anyone asks when a
      # driver regresses, and it is not recoverable after the fact — the build
      # clones --depth=1 and the log never prints the sha.
      - name: Record the mesa commit that was built
        id: mesa
        run: |
          set -euo pipefail
          commit=$(tr -d '[:space:]' < mesa_hash.txt)
          version=$(tr -d '[:space:]' < mesa_version.txt 2>/dev/null || echo unknown)
          [ -n "$commit" ] || { echo "::error::mesa_hash.txt is empty"; exit 1; }
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Built from mesa ${commit} (${version})"

      - name: Verify output zips exist
        run: |
          ls -lh "WN-Turnip-${{ steps.ver.outputs.build_version }}-b_Axxx.zip" \
                  "WN-Turnip-${{ steps.ver.outputs.build_version }}-p_Axxx.zip"

      # Upload -b and -p as SEPARATE artifacts. A single multi-file artifact is
      # bundled by GitHub into one .zip; separate names keep the variants apart.
      - name: Upload -b artifact
        uses: actions/upload-artifact@v4
        with:
          name: WN-Turnip-${{ steps.ver.outputs.build_version }}-b_Axxx
          path: WN-Turnip-${{ steps.ver.outputs.build_version }}-b_Axxx.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload -p artifact
        uses: actions/upload-artifact@v4
        with:
          name: WN-Turnip-${{ steps.ver.outputs.build_version }}-p_Axxx
          path: WN-Turnip-${{ steps.ver.outputs.build_version }}-p_Axxx.zip
          if-no-files-found: error
          retention-days: 30

      # The per-variant logs are how a drifted anchor is diagnosed after the fact.
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ steps.ver.outputs.build_version }}
          path: |
            build_log_*.txt
            mesa_hash.txt
            mesa_version.txt
          if-no-files-found: warn
          retention-days: 30

  release:
    needs: build
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Needed for the driver-side changelog: release_notes.py runs git log
      # against the previous release tag, so the tags have to be here.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.build.outputs.head_sha }}
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: WN-Turnip-${{ needs.build.outputs.build_version }}-*_Axxx
          merge-multiple: true

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.build_version }}
          TAG: ${{ needs.build.outputs.tag_name }}
          MESA_COMMIT: ${{ needs.build.outputs.mesa_commit }}
          MESA_VERSION: ${{ needs.build.outputs.mesa_version }}
        run: |
          set -euo pipefail
          python3 release_notes.py > RELEASE_NOTES.md
          echo "----- generated notes -----"
          cat RELEASE_NOTES.md

      # GitHub lets several drafts share one tag name, so re-running a draft
      # build would otherwise stack up duplicates. Only drafts are touched;
      # a published release with this tag is left alone and the publish guard
      # in the build job has already refused that case.
      - name: Clear any previous draft for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag_name }}
        run: |
          set -euo pipefail
          ids=$(gh api "repos/${REPO}/releases?per_page=100" \
                  --jq ".[] | select(.draft==true and .tag_name==\"${TAG}\") | .id")
          for id in $ids; do
            echo "Deleting stale draft release $id for ${TAG}"
            gh api -X DELETE "repos/${REPO}/releases/${id}"
          done

      - name: Create GitHub Release
        # softprops/action-gh-release v2.0.8
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191
        with:
          tag_name: ${{ needs.build.outputs.tag_name }}
          name: WN-Turnip ${{ needs.build.outputs.build_version }}
          target_commitish: ${{ needs.build.outputs.head_sha }}
          body_path: RELEASE_NOTES.md
          draft: ${{ needs.build.outputs.publish != 'true' }}
          files: |
            WN-Turnip-${{ needs.build.outputs.build_version }}-b_Axxx.zip
            WN-Turnip-${{ needs.build.outputs.build_version }}-p_Axxx.zip
          fail_on_unmatched_files: true
          make_latest: ${{ needs.build.outputs.publish == 'true' }}

      - name: Report
        env:
          TAG: ${{ needs.build.outputs.tag_name }}
        run: |
          if [ "${{ needs.build.outputs.publish }}" = "true" ]; then
            echo "Published ${TAG}."
          else
            echo "Draft ${TAG} created. Review it, then hit Publish to create the tag."
          fi

      # Mirror to the shared WinNative-Components release. A draft is not a
      # release anyone should be consuming yet, so this only runs on a publish.
      # Needs a COMPONENTS_TOKEN secret (PAT with contents:write on that repo);
      # skips cleanly if the secret is absent, which is the case in forks.
      - name: Mirror -b/-p to WinNative-Components
        if: needs.build.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.COMPONENTS_TOKEN }}
          VER: ${{ needs.build.outputs.build_version }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::COMPONENTS_TOKEN not set — skipping WinNative-Components mirror."
            exit 0
          fi
          repo="nicholasx417/WinNative-Components"
          tag="WinNative-Turnip"
          gh release view "$tag" --repo "$repo" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$repo" \
                 --title "WinNative Turnip Drivers" \
                 --notes "Rolling WinNative Turnip driver uploads."
          gh release upload "$tag" \
            "WN-Turnip-${VER}-b_Axxx.zip" \
            "WN-Turnip-${VER}-p_Axxx.zip" \
            --repo "$repo" --clobber
